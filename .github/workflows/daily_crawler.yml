name: Daily Commodity Price Crawler & Notifier

on:
  schedule:
    # 兜底双轨调度：北京时间每天 06:38 (UTC 22:38)
    - cron: '38 22 * * *'
  workflow_dispatch: # 远程 API / 手动即时秒级触发
    inputs:
      trigger_source:
        description: '触发来源 (如 vps-cron / local / manual)'
        required: false
        default: 'manual'

# 任务排队互斥锁：防止外部调度与 GitHub 定时同时触发造成重复推送
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler & Send Email
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_AUTH_TOKEN: ${{ secrets.EMAIL_AUTH_TOKEN }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          EMAIL_SSL: ${{ secrets.EMAIL_SSL }}
        run: |
          python main.py

      - name: Upload Daily Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Daily_Report_Backup_${{ github.run_id }}
          path: reports/*.xlsx
          retention-days: 14
